name: Update pen news

on:
  schedule:
    - cron: "17 5 * * *"   # codziennie ok. 05:17 UTC (07:17 latem / 06:17 zimą w Polsce)
  workflow_dispatch:        # przycisk "Run workflow" do ręcznego odświeżenia

permissions:
  contents: write

concurrency:
  group: pennews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz wpisy i wygeneruj stronę
        run: python pennews.py

      - name: Zapisz zmiany (stan + strona)
        run: |
          git config user.name "pennews-bot"
          git config user.email "pennews-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Aktualizacja $(date -u +%F)"
          git push
