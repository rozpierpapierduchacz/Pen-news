name: Reset pen news

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rebuild = wyczysc i zbuduj od nowa z feedow, wipe = wyczysc i zostaw pusta strone"
        type: choice
        options:
          - rebuild
          - wipe
        default: rebuild

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Wyczysc dane i strone
        run: rm -f data/entries.json data/status.json docs/index.html docs/feed.xml

      - name: Odbuduj z feedow
        if: ${{ inputs.mode == 'rebuild' }}
        run: python pennews.py

      - name: Pusta strona
        if: ${{ inputs.mode == 'wipe' }}
        run: |
          mkdir -p docs data
          echo '<!doctype html><meta charset="utf-8"><title>Pusto</title><p>Strona wyczyszczona.</p>' > docs/index.html

      - name: Zapisz zmiany
        run: |
          git config user.name "pennews-bot"
          git config user.email "pennews-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Reset (${{ inputs.mode }})"
          git push
